name: MatSide
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MatSide:
    type: application
    platform: iOS
    sources:
      - path: MatSide
    info:
      path: MatSide/Info.plist
      properties:
        CFBundleDisplayName: Mat Side
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.matside
        GENERATE_INFOPLIST_FILE: NO
  MatSideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MatSideTests
    dependencies:
      - target: MatSide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.matside.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MatSide:
    build:
      targets:
        MatSide: all
        MatSideTests: [test]
    test:
      targets:
        - MatSideTests
